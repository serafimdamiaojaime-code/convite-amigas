<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle,#fffdf8,#f6dedc);font-family:Georgia,serif;color:#174d2b}
#cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:3;transition:1s}
.env{width:min(82vw,420px);height:min(52vw,260px);position:relative;filter:drop-shadow(0 18px 25px #7b3d4040);animation:fl 2.5s ease-in-out infinite}
.base{position:absolute;inset:0;border:3px solid #bd1e61;border-radius:16px;background:#fff8ea;overflow:hidden}
.base:before,.base:after{content:"";position:absolute;bottom:0;width:70%;height:3px;background:#bd1e61}
.base:before{left:-7%;transform:rotate(32deg);transform-origin:left bottom}.base:after{right:-7%;transform:rotate(-32deg);transform-origin:right bottom}
.flap{position:absolute;left:0;top:0;width:100%;height:65%;background:#ffecef;border:3px solid #bd1e61;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:1.15s;z-index:2}
.heart{position:absolute;z-index:4;left:50%;top:48%;transform:translate(-50%,-50%);font-size:64px;color:#bd1e61}
h1{font-size:27px;margin:34px 0 5px;color:#633044;text-align:center}p{margin:0;color:#8a6470;font-size:16px;text-align:center}
#invite{position:fixed;inset:0;padding:10px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.9);transition:1.1s;pointer-events:none}
#invite img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 15px 40px #4d282833}
.open #cover{opacity:0;transform:scale(1.08);pointer-events:none}.open .flap{transform:rotateX(155deg)}
.open #invite{opacity:1;transform:scale(1);pointer-events:auto}
.flower{position:fixed;top:-30px;z-index:5;animation:fall 4s linear forwards;pointer-events:none}
@keyframes fl{50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style></head><body>
